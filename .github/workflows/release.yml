name: Release

# A tag v* publishes a release: binaries, Linux packages, Windows installers
# and the container image. Run it by hand (workflow_dispatch) for a dry run
# that builds and tests everything but publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist

  # Binaries, archives, .deb/.rpm, checksums, and the GitHub release itself.
  binaries:
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean ${{ env.PUBLISH != 'true' && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.PUBLISH == 'true'
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages
          path: dist/*_amd64.deb

  # Installs the .deb packages on a real systemd host and checks they work.
  test-linux-packages:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages
      - name: Install and check the server package
        run: |
          set -x
          sudo apt-get install -y ./certower_*_amd64.deb
          systemctl is-active certower
          for i in $(seq 30); do certower healthcheck && break; sleep 1; done
          certower healthcheck
          sudo -u certower certower bootstrap -config /etc/certower/certower.env -email admin@example.com
          test "$(sudo stat -c '%U %a' /var/lib/certower/certower.kek)" = "certower 600"
          test "$(sudo stat -c '%G %a' /etc/certower/certower.env)" = "certower 640"
          curl -fsS -X POST localhost:8080/api/v1/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","password":"wrong"}' -o /dev/null -w '%{http_code}\n' | grep -q 401
      - name: Install and check the agent package
        run: |
          set -x
          sudo apt-get install -y ./certower-agent_*_amd64.deb
          certower-agent version
          systemctl is-enabled certower-agent
          # Not enrolled yet, so the unit's condition keeps it from starting.
          sudo systemctl start certower-agent
          if systemctl is-active certower-agent; then exit 1; fi
      - name: Remove keeps data
        run: |
          sudo apt-get remove -y certower certower-agent
          if systemctl is-active certower; then exit 1; fi
          sudo test -f /var/lib/certower/certower.kek

  windows-installers:
    needs: [web, binaries]
    runs-on: windows-latest
    permissions:
      contents: write # upload installers to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - name: Version
        shell: bash
        run: |
          if [ "$PUBLISH" = true ]; then v="${GITHUB_REF_NAME#v}"; else v=0.0.1; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Build executables
        shell: bash
        run: |
          ld="-s -w -X github.com/tntrock/certower/internal/version.Version=$VERSION -X github.com/tntrock/certower/internal/version.Commit=${GITHUB_SHA::7}"
          go build -trimpath -ldflags "$ld" -o bin/certower.exe ./cmd/certower
          go build -trimpath -ldflags "$ld" -o bin/certower-agent.exe ./cmd/certower-agent
      - name: Build installers
        run: |
          # WiX v5 (MS-RL). Later versions add a maintenance fee for commercial users.
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix build -arch x64 -ext WixToolset.Util.wixext -d Version=$env:VERSION -d BinDir=bin packaging/windows/certower.wxs -o "certower_$($env:VERSION)_windows_amd64.msi"
          wix build -arch x64 -ext WixToolset.Util.wixext -d Version=$env:VERSION -d BinDir=bin packaging/windows/certower-agent.wxs -o "certower-agent_$($env:VERSION)_windows_amd64.msi"
          Get-FileHash *.msi -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content msi-checksums.txt
          Get-Content msi-checksums.txt
      - name: Test the server installer
        run: |
          $msi = Get-Item "certower_*.msi"
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 60; exit 1 }
          (Get-Service Certower).Status
          $exe = "C:\Program Files\Certower\certower.exe"
          $cfg = "C:\ProgramData\Certower\certower.env"
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) { & $exe healthcheck -config $cfg; if ($LASTEXITCODE -eq 0) { $ok = $true; break }; Start-Sleep 1 }
          if (-not $ok) { Get-Content C:\ProgramData\Certower\certower.log -ErrorAction SilentlyContinue; exit 1 }
          & $exe bootstrap -config $cfg -email admin@example.com
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path C:\ProgramData\Certower\certower.kek)) { throw "no KEK" }
          $acl = (Get-Acl C:\ProgramData\Certower).Access | ForEach-Object { $_.IdentityReference.Value }
          $acl
          if ($acl -match "Users") { throw "data folder is readable by Users" }
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          if (Get-Service Certower -ErrorAction SilentlyContinue) { throw "service left behind" }
          if (-not (Test-Path C:\ProgramData\Certower\certower.kek)) { throw "uninstall removed data" }
      - name: Test the agent installer
        run: |
          $msi = Get-Item "certower-agent_*.msi"
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v agent-install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content agent-install.log -Tail 60; exit 1 }
          $s = Get-Service CertowerAgent
          if ($s.StartType -ne "Manual") { throw "agent should wait for enrollment" }
          & "C:\Program Files\Certower Agent\certower-agent.exe" version
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installers
          path: |
            *.msi
            msi-checksums.txt
      - name: Upload to the release
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" *.msi msi-checksums.txt --repo "$GITHUB_REPOSITORY"

  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ env.PUBLISH }}
            type=sha
          labels: |
            org.opencontainers.image.title=Certower
            org.opencontainers.image.description=Self-hosted control tower for TLS certificates
            org.opencontainers.image.licenses=AGPL-3.0-only
      - name: Build for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: certower:test
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
      - name: Smoke test
        run: |
          set -x
          docker run -d --name ct -p 8080:8080 certower:test
          for i in $(seq 60); do [ "$(docker inspect -f '{{.State.Health.Status}}' ct)" = healthy ] && break; sleep 2; done
          docker inspect -f '{{.State.Health.Status}}' ct | grep -q healthy
          docker exec ct certower bootstrap -email admin@example.com
          docker exec ct certower version
          test "$(docker exec ct certower version)" != "certower dev (unknown)"
          curl -fsS localhost:8080/api/v1/version
          docker logs ct
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.PUBLISH == 'true'
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
